<!DOCTYPE html>
<html lang="ar" :dir="settings.lang === 'ar' ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="settings.appTitle">MOUNIR ESPACE-MODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        [x-cloak] { display: none !important; }
        @media print { .no-print { display: none !important; } }
        body { font-family: 'Cairo', sans-serif; background-color: #fdfaf6; transition: all 0.3s ease; color: black; }
        .logo-img { width: 60px; height: 60px; object-fit: cover; border-radius: 50%; border: 2px solid; }
        .instruction-box { background-color: #fff5f5; border: 2px solid #feb2b2; border-radius: 1rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        select option { color: black !important; background: white !important; font-weight: bold; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body x-data="mounirApp()" x-init="init()">

    <!-- شاشة التحميل (معدلة لتختفي تلقائياً) -->
    <div x-show="loading" class="loading-overlay">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-black mb-4"></div>
        <p class="font-bold text-black" x-text="settings.lang === 'ar' ? 'جاري فتح التطبيق...' : 'Ouverture...'"></p>
    </div>

    <!-- Header -->
    <header :style="{ backgroundColor: settings.primaryColor }" class="text-white p-5 shadow-2xl flex justify-between items-center no-print sticky top-0 z-50 border-b-2" :style="{ borderBottomColor: settings.accentColor }">
        <div class="flex items-center gap-3">
            <template x-if="settings.logo"><img :src="settings.logo" :style="{ borderColor: settings.accentColor }" class="logo-img shadow-lg"></template>
            <template x-if="!settings.logo">
                <div :style="{ backgroundColor: settings.accentColor }" class="p-2 rounded-full font-bold text-black shadow-lg w-12 h-12 flex items-center justify-center text-xl">
                    <span x-text="settings.appTitle ? settings.appTitle.charAt(0) : 'M'">M</span>
                </div>
            </template>
            <h1 :style="{ color: settings.accentColor }" class="text-xl font-bold tracking-widest uppercase italic" x-text="settings.appTitle || 'MOUNIR MODE'"></h1>
        </div>
        <nav class="flex gap-4">
            <button @click="view = 'customer'" class="hover:opacity-80 transition font-bold text-sm" x-text="t('newOrder')"></button>
            <button @click="loginAdmin()" class="bg-white text-black px-4 py-1 rounded-full font-bold text-xs hover:opacity-90 transition shadow" x-text="t('adminPanel')"></button>
        </nav>
    </header>

    <main class="container mx-auto mt-6 p-4 max-w-5xl">

        <!-- واجهة الزبون -->
        <template x-if="view === 'customer'">
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 animate-fadeIn">
                <div :style="{ backgroundColor: settings.primaryColor, borderBottomColor: settings.accentColor }" class="p-4 text-center border-b-2">
                    <h2 class="text-white text-xl font-black italic uppercase tracking-widest" x-text="settings.heroText"></h2>
                </div>

                <div class="p-8 space-y-8 text-black font-bold">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="font-bold flex items-center gap-2" x-text="t('customerType')"></label>
                            <select x-model="order.customerType" class="w-full border-2 p-3 rounded-xl outline-none bg-white font-bold text-black shadow-sm">
                                <option value="" x-text="t('select')"></option>
                                <option :value="t('woman')" x-text="t('woman')"></option>
                                <option :value="t('man')" x-text="t('man')"></option>
                                <option :value="t('girl')" x-text="t('girl')"></option>
                                <option :value="t('boy')" x-text="t('boy')"></option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="font-bold flex items-center gap-2" x-text="t('selectGarment')"></label>
                            <select x-model="order.garmentType" @change="updateFields()" class="w-full border-2 p-3 rounded-xl outline-none font-bold text-blue-900 bg-white shadow-sm">
                                <option value="" x-text="t('select')"></option>
                                <template x-for="type in Object.keys(garmentFields)" :key="type">
                                    <option :value="type" x-text="type"></option>
                                </template>
                            </select>
                        </div>
                    </div>

                    <!-- ألبوم الصور -->
                    <div class="space-y-4" x-show="models.length > 0">
                        <label :style="{ borderRightColor: settings.accentColor, borderLeftColor: settings.accentColor }" class="font-bold text-lg border-x-4 px-3 italic" x-text="t('selectModel')"></label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <template x-for="m in models" :key="m.id">
                                <div @click="order.model = m.name; order.price = m.price" 
                                     :class="order.model === m.name ? 'ring-4 shadow-2xl scale-105' : 'border-2'"
                                     :style="{ ringColor: settings.accentColor, borderColor: order.model === m.name ? settings.accentColor : '#f3f4f6' }"
                                     class="cursor-pointer relative rounded-xl overflow-hidden bg-gray-50 transition transform shadow-sm">
                                    <img :src="m.img" class="w-full h-48 object-cover">
                                    <div class="p-2 text-center bg-white border-t">
                                        <p class="font-bold text-sm uppercase text-black" x-text="m.name"></p>
                                        <p :style="{ color: settings.accentColor }" class="font-bold" x-text="m.price + ' ' + t('currency')"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- الأقمشة -->
                    <div class="space-y-4" x-show="fabrics.length > 0">
                        <label :style="{ borderRightColor: settings.accentColor, borderLeftColor: settings.accentColor }" class="font-bold text-lg border-x-4 px-3 italic" x-text="t('selectFabric')"></label>
                        <div class="flex gap-4 overflow-x-auto pb-4">
                            <template x-for="f in fabrics" :key="f.id">
                                <div @click="order.fabric = f.name" 
                                     :style="order.fabric === f.name ? { backgroundColor: settings.accentColor, borderColor: settings.accentColor, color: '#000' } : { backgroundColor: '#fff', borderColor: '#e5e7eb' }"
                                     class="cursor-pointer border-2 px-6 py-3 rounded-full whitespace-nowrap transition font-bold shadow-sm" x-text="f.name">
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- القياسات -->
                    <template x-if="order.garmentType">
                        <div :style="{ borderColor: settings.accentColor + '44' }" class="bg-gray-50 p-6 rounded-2xl border-2 border-dashed">
                            <h3 class="font-bold text-lg mb-6 border-b pb-2 text-black font-black" x-text="t('enterMeasurements')"></h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 font-bold">
                                <template x-for="field in garmentFields[order.garmentType]" :key="field">
                                    <div class="space-y-1">
                                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-tighter" x-text="t(field) || field"></label>
                                        <input type="number" x-model="order.measurements[field]" class="w-full border-2 p-2 rounded-lg outline-none focus:border-black font-mono shadow-inner text-black font-black">
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t">
                        <input type="text" :placeholder="t('fullName')" x-model="order.customerName" class="w-full border-2 p-3 rounded-xl outline-none font-bold text-black">
                        <input type="tel" :placeholder="t('phone')" x-model="order.phone" class="w-full border-2 p-3 rounded-xl outline-none font-bold text-black">
                        <input type="text" :placeholder="t('city')" x-model="order.city" class="w-full border-2 p-3 rounded-xl outline-none font-bold text-black">
                        <textarea :placeholder="t('address')" x-model="order.fullAddress" class="w-full border-2 p-3 rounded-xl outline-none h-20 font-bold text-black"></textarea>
                    </div>

                    <button @click="submitOrder()" :style="{ backgroundColor: settings.primaryColor }" class="w-full text-white py-5 rounded-2xl text-2xl font-bold shadow-lg hover:opacity-90 transition transform" x-text="t('confirmBtn')"></button>
                </div>
            </div>
        </template>

        <!-- الفاتورة -->
        <template x-if="view === 'invoice'">
            <div class="max-w-2xl mx-auto bg-white p-10 rounded-xl shadow-2xl border-t-8 border-black animate-fadeIn text-black font-bold">
                <div class="flex justify-between items-start border-b pb-6 mb-6">
                    <div class="flex items-center gap-3">
                         <template x-if="settings.logo"><img :src="settings.logo" class="logo-img"></template>
                         <div>
                            <h2 :style="{ color: settings.accentColor }" class="text-3xl font-black italic underline" x-text="settings.appTitle"></h2>
                            <p class="text-[10px] text-gray-400 mt-1 uppercase" x-text="settings.heroText"></p>
                         </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-xl" x-text="t('orderNo') + ': #MO-' + order.id"></p>
                        <p class="text-xs text-gray-500 font-mono" x-text="order.date"></p>
                    </div>
                </div>

                <!-- صندوق الأمان من الصورة -->
                <div class="instruction-box">
                    <h4 class="text-red-700 font-black flex items-center gap-2 mb-3 text-lg">
                        <span>⚠️</span> <span x-text="t('payTitle')"></span>
                    </h4>
                    <ul class="text-sm text-red-900 font-bold space-y-3 pr-4 list-disc">
                        <li x-html="t('payPoint1').replace('{id}', '#MO-'+order.id)"></li>
                        <li x-text="t('payPoint2')"></li>
                        <li x-text="t('payPoint3')"></li>
                    </ul>
                </div>

                <div :style="{ borderColor: settings.accentColor }" class="border-2 p-6 rounded-xl bg-gray-50 space-y-4 mb-8 shadow-inner font-bold text-black">
                    <p class="text-center font-bold border-b pb-2 uppercase gold-color italic tracking-widest font-black text-black" x-text="t('bankInfo')"></p>
                    <div class="space-y-2 text-sm font-bold">
                        <p x-text="t('bankName') + ': ' + settings.bankName"></p>
                        <p class="underline" x-text="t('rib') + ':'"></p>
                        <p :style="{ borderColor: settings.accentColor }" class="font-mono bg-white p-3 text-center rounded border text-lg font-bold tracking-widest select-all shadow-md text-black" x-text="settings.rib"></p>
                        <p class="text-right text-lg font-bold border-t pt-2">المبلغ المطلوب: <span :style="{ color: settings.accentColor }" class="font-black text-2xl" x-text="order.price + ' درهم'"></span></p>
                    </div>
                </div>

                <div class="bg-black text-white p-5 rounded-xl mb-8 shadow-xl text-center border-b-4" :style="{ borderBottomColor: settings.accentColor }">
                    <label class="block text-sm font-bold gold-color underline italic mb-3" x-text="t('enterRef')"></label>
                    <input type="text" x-model="order.refNumber" :placeholder="t('refPlaceholder')" class="w-full p-3 rounded-lg text-black font-mono font-bold outline-none border-2 border-gold text-center">
                </div>

                <div class="flex flex-col gap-3 no-print">
                    <button @click="confirmWithWhatsApp()" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg flex justify-center items-center gap-2 hover:bg-green-700 transition">
                         إرسال وصل التحويل عبر WhatsApp
                    </button>
                    <div class="flex gap-2">
                        <button onclick="window.print()" class="flex-1 bg-black text-white py-3 rounded-lg font-bold shadow-lg" x-text="t('print')"></button>
                        <button @click="view = 'customer'" class="flex-1 bg-gray-200 py-3 rounded-lg font-bold text-gray-600 shadow-lg" x-text="t('back')"></button>
                    </div>
                </div>
            </div>
        </template>

        <!-- لوحة التحكم -->
        <template x-if="view === 'admin'">
            <div class="space-y-6 no-print animate-fadeIn text-black font-bold">
                <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow border border-gold">
                    <h2 class="text-2xl font-black italic gold-color underline" x-text="t('adminPanel')"></h2>
                    <div class="flex gap-2 flex-wrap text-[10px]">
                        <button @click="adminTab = 'orders'" :class="adminTab === 'orders' ? 'bg-black text-white' : 'bg-gray-200'" class="px-4 py-1 rounded-full font-bold transition">الطلبات</button>
                        <button @click="adminTab = 'garments'" :class="adminTab === 'garments' ? 'bg-black text-white' : 'bg-gray-200'" class="px-4 py-1 rounded-full font-bold transition">القياسات</button>
                        <button @click="adminTab = 'catalog'" :class="adminTab === 'catalog' ? 'bg-black text-white' : 'bg-gray-200'" class="px-4 py-1 rounded-full font-bold transition">الألبوم</button>
                        <button @click="adminTab = 'settings'" :class="adminTab === 'settings' ? 'bg-black text-white' : 'bg-gray-200'" class="px-4 py-1 rounded-full font-bold transition">الإعدادات</button>
                    </div>
                </div>

                <!-- تبويب الإعدادات -->
                <div x-show="adminTab === 'settings'" class="bg-white p-6 rounded-2xl shadow-xl border-t-8 border-gold space-y-6 text-black">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <h3 class="font-bold border-b pb-1 text-gold-700 italic">البنك والحماية</h3>
                            <div class="bg-blue-50 p-2 rounded border border-blue-200 shadow-sm">
                                <label class="text-xs font-bold block mb-1">اللغة / Langue:</label>
                                <select x-model="settings.lang" @change="saveToCloud()" class="w-full border p-1 rounded font-bold text-black outline-none shadow-sm">
                                    <option value="ar">العربية</option>
                                    <option value="fr">Français</option>
                                </select>
                            </div>
                            <div><label class="text-xs font-bold">اسم البنك:</label><input type="text" x-model="settings.bankName" class="w-full border p-2 rounded shadow-sm text-black"></div>
                            <div><label class="text-xs font-bold">RIB:</label><input type="text" x-model="settings.rib" class="w-full border p-2 rounded font-mono text-sm shadow-sm text-black"></div>
                            <div><label class="text-xs font-bold text-red-600 underline">كلمة مرور المسؤول:</label><input type="password" x-model="settings.adminPassword" class="w-full border p-2 rounded shadow-sm text-black"></div>
                        </div>

                        <div class="space-y-4">
                            <h3 class="font-bold border-b pb-1 text-blue-700 italic">الهوية والكلمات</h3>
                            <div class="bg-yellow-50 p-3 rounded border border-yellow-200 shadow-inner">
                                <label class="text-xs font-bold block mb-1 text-red-600 underline italic tracking-tight font-black">عنوان البطاقة (بدلاً من MODE):</label>
                                <input type="text" x-model="settings.heroText" class="w-full border-2 border-gold p-2 rounded text-black font-black">
                            </div>
                            <div class="bg-gray-50 p-2 rounded border border-gray-300 shadow-inner">
                                <label class="text-xs font-bold block mb-2">رفع الشعار (Logo):</label>
                                <div class="flex items-center gap-4">
                                    <template x-if="settings.logo"><img :src="settings.logo" class="logo-img"></template>
                                    <input type="file" @change="uploadLogo" class="text-[10px] w-full text-black font-bold">
                                </div>
                            </div>
                            <div><label class="text-xs font-bold text-green-700 font-black underline">رقم الواتساب (212...):</label><input type="text" x-model="settings.myWhatsApp" class="w-full border-2 border-green-200 p-2 rounded text-black font-bold"></div>
                            <div><label class="text-xs font-bold">اسم المتجر العلوي:</label><input type="text" x-model="settings.appTitle" class="w-full border p-2 rounded text-black font-bold"></div>
                            <div class="flex gap-2">
                                <div class="flex-1 text-black font-bold"><label class="text-[10px]">اللون الرئيسي:</label><input type="color" x-model="settings.primaryColor" class="w-full h-8 border cursor-pointer"></div>
                                <div class="flex-1 text-black font-bold"><label class="text-[10px]">اللون الذهبي:</label><input type="color" x-model="settings.accentColor" class="w-full h-8 border cursor-pointer"></div>
                            </div>
                        </div>
                    </div>
                    <button @click="saveToCloud(); alert('تم الحفظ بنجاح!')" class="bg-black text-white px-10 py-3 rounded-full font-bold shadow-lg hover:bg-gold transition uppercase tracking-widest font-black">حفظ التغييرات للجميع</button>
                </div>

    <!-- إدارة الملابس -->
                <div x-show="adminTab === 'garments'" class="bg-white p-6 rounded-2xl shadow-xl border-t-8 border-black space-y-6 text-black">
                    <h3 class="font-bold text-xl border-b pb-2 italic gold-color underline">⚙️ إدارة الأصناف والقياسات</h3>
                    <div class="space-y-4">
                        <template x-for="(fields, type) in garmentFields" :key="type">
                            <div class="border p-4 rounded-xl bg-gray-50 flex justify-between items-start shadow-sm">
                                <div class="flex-1">
                                    <h4 class="font-bold text-blue-800 mb-2 border-r-4 border-blue-800 pr-2" x-text="type"></h4>
                                    <div class="flex flex-wrap gap-2">
                                        <template x-for="(field, index) in fields" :key="index">
                                            <span class="bg-white border px-2 py-1 rounded text-[10px] font-bold flex items-center gap-1 shadow-sm">
                                                <span x-text="t(field) || field"></span>
                                                <button @click="removeField(type, index)" class="text-red-500 font-bold ml-1">×</button>
                                            </span>
                                        </template>
                                        <button @click="addField(type)" class="text-green-600 font-bold text-[10px] underline tracking-tighter decoration-dotted font-black">+ إضافة قياس</button>
                                    </div>
                                </div>
                                <button @click="deleteGarmentType(type)" class="text-red-600 text-[10px] font-bold bg-white px-2 py-1 rounded border shadow-sm hover:bg-red-600 hover:text-white transition shadow-sm">حذف الصنف</button>
                            </div>
                        </template>
                        <button @click="addNewGarmentType()" class="w-full border-2 border-dashed border-black py-4 rounded-xl font-bold hover:bg-black hover:text-white transition shadow-sm font-black">+ إضافة نوع لباس جديد</button>
                    </div>
                </div>

                <!-- الألبوم -->
                <div x-show="adminTab === 'catalog'" class="grid grid-cols-1 md:grid-cols-2 gap-6 text-black font-bold">
                    <div class="bg-white p-6 rounded-2xl shadow border-t-4 border-gold">
                        <h3 class="font-bold mb-4 border-b pb-1">إدارة الألبوم (الموديلات)</h3>
                        <div class="space-y-2 mb-4 bg-gray-50 p-2 rounded border">
                            <input type="text" x-model="newMod.name" placeholder="اسم الموديل" class="w-full border p-1 text-xs">
                            <input type="number" x-model="newMod.price" placeholder="الثمن" class="w-full border p-1 text-xs text-black font-black">
                            <input type="file" @change="uploadModelImg" class="text-[9px] w-full">
                            <button @click="addMod()" class="w-full bg-gold text-black py-1 rounded font-bold text-xs shadow-sm">+ إضافة</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto">
                            <template x-for="(m, i) in models" :key="m.id">
                                <div class="border p-1 rounded relative bg-white shadow-sm"><img :src="m.img" class="w-full h-12 object-cover rounded shadow-inner"><p class="text-[10px] font-bold" x-text="m.name"></p><button @click="deleteModel(m.id)" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-4 h-4 text-xs font-black shadow-lg">×</button></div>
                            </template>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow border-t-4 border-black">
                        <h3 class="font-bold mb-4 border-b pb-1">إدارة الأقمشة</h3>
                        <div class="flex gap-2 mb-4"><input type="text" x-model="newFab" placeholder="قماش جديد" class="flex-1 border p-1 text-xs font-bold text-black"><button @click="addFab()" class="bg-black text-white px-3 rounded font-bold text-xs shadow-sm">إضافة</button></div>
                        <div class="flex flex-wrap gap-2 max-h-60 overflow-y-auto">
                            <template x-for="(f, i) in fabrics" :key="f.id">
                                <div class="bg-gray-100 px-3 py-1 rounded-full border text-[10px] font-bold flex items-center gap-2 shadow-sm text-black font-black"><span x-text="f.name"></span><button @click="deleteFabric(f.id)" class="text-red-500 font-bold">×</button></div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- الطلبات -->
                <div x-show="adminTab === 'orders'" class="bg-white rounded-2xl shadow-xl overflow-hidden border text-black font-bold">
                    <table class="w-full text-right text-xs md:text-sm">
                        <thead class="bg-black text-white font-black uppercase tracking-widest italic">
                            <tr><th class="p-4">الزبون</th><th class="p-4">اللباس</th><th class="p-4">المبلغ</th><th class="p-4 text-gold-500 italic">الرقم المرجعي</th><th class="p-4">تحكم</th></tr>
                        </thead>
                        <tbody>
                            <template x-for="o in allOrders" :key="o.id">
                                <tr class="border-b hover:bg-yellow-50 transition border-gray-100 font-bold">
                                    <td class="p-4 font-bold" x-text="o.customerName"></td>
                                    <td class="p-4 font-bold" x-text="o.garmentType"></td>
                                    <td class="p-4 font-black text-gold-600" x-text="o.price + ' MAD'"></td>
                                    <td class="p-4 font-mono font-bold text-blue-700 bg-blue-50 text-center shadow-inner" x-text="o.refNumber || '---'"></td>
                                    <td class="p-4 flex gap-2"><button @click="order = o; view = 'invoice'" class="text-blue-600 font-bold underline" x-text="t('view')"></button><button @click="deleteOrderCloud(o.id)" class="text-red-500 font-bold" x-text="t('delete')"></button></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </template>
    </main>

    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
          apiKey: "AIzaSyACA1TBYTfvBBtD2V6qLLKQKAdO_a8wRZU",
          authDomain: "fashionapp-1c25e.firebaseapp.com",
          databaseURL: "https://fashionapp-1c25e-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "fashionapp-1c25e",
          storageBucket: "fashionapp-1c25e.firebasestorage.app",
          messagingSenderId: "716111219310",
          appId: "1:716111219310:web:67d344b1e8838d2074347f"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function mounirApp() {
            const lexicon = {
                ar: {
                    newOrder: "طلب جديد", adminPanel: "لوحة التحكم 🔒", customerType: "نوع الزبون", woman: "امرأة", man: "رجل", girl: "بنت", boy: "ولد",
                    garmentType: "نوع اللباس", select: "اختر...", selectGarment: "ماذا تريد أن تفصل؟", selectModel: "اختر الموديل المطلوب",

                    phone: "رقم الهاتف (واتساب)", city: "المدينة", address: "العنوان الكامل للشحن", confirmBtn: "تأكيد الطلب واستخراج الفاتورة",
                    orderNo: "رقم الطلب", bankInfo: "بيانات التحويل البنكي", bankName: "البنك", rib: "رقم الحساب (RIB)", total: "المبلغ المطلوب",
                    currency: "درهم", enterRef: "أدخل رقم العملية المكتوب في الوصل:", refPlaceholder: "أدخل الرقم هنا...",
                    whatsappBtn: "إرسال وصل التحويل عبر WhatsApp", print: "طباعة", back: "رجوع", tabOrders: "الطلبات", 
                    saveBtn: "حفظ الإعدادات للجميع", refNumberShort: "الرقم المرجعي", view: "عرض", delete: "حذف",

                    payPoint2: "لا تبدأ عملية الخياطة إلا بعد تأكدنا من دخول المبلغ لحسابنا.",
                    payPoint3: "إرسال صورة الوصل المزور يعرضك للمساءلة القانونية.",
                    épaule: "الكتف", poitrine: "الصدر", "tour de taille": "دورة الخصر", hanche: "الورك", bassin: "الحوض", "longueur poitrine": "طول الصدر", "longueur taille": "طول الخصر", "longueur hanche": "طول الورك", "longueur bassin": "طول الحوض", "longueur genou": "طول الركبة", "longueur totale": "الطول الكلي", "longueur manche": "طول الكم", "tour de bras": "دورة الذراع", poignée: "المعصم", ceinture: "الحزام", cuisse: "الفخذ", Molet: "بطة الساق", palma: "عرض الساق", taille: "الخصر"
                },
                fr: {
                    newOrder: "Nouveau", adminPanel: "Admin 🔒", customerType: "Genre", woman: "Femme", man: "Homme", girl: "Fille", boy: "Garçon",
                    garmentType: "Vêtement", select: "Choisir...", selectGarment: "Type de vêtement ?", selectModel: "Modèle",
                    selectFabric: "Tissu", enterMeasurements: "Mesures (cm)", fullName: "Nom Complet",
                    phone: "WhatsApp", city: "Ville", address: "Livraison", confirmBtn: "Confirmer",
                    orderNo: "N° Commande", bankInfo: "Virement Bancaire", bankName: "Banque", rib: "RIB", total: "Total",
                    currency: "MAD", enterRef: "N° transaction :", refPlaceholder: "Référence...",
                    whatsappBtn: "Envoyer reçu via WhatsApp", print: "Imprimer", back: "Retour",
                    épaule: "Épaule", poitrine: "Poitrine", "tour de taille": "Tour de taille", hanche: "Hanche", bassin: "Bassin", "longueur poitrine": "L. Poitrine", "longueur totale": "L. Totale", "longueur manche": "L. Manche", "tour de bras": "Tour de bras", poignée: "Poignée", ceinture: "Ceinture", cuisse: "Cuisse", Molet: "Mollet", palma: "Palma", taille: "Taille"
                }
            };

            return {
                view: 'customer', adminTab: 'orders', loading: true, newMod: {name:'', price:'', img:''}, newFab: '',
                settings: { lang: 'ar', appTitle: 'MOUNIR ESPACE-MODE', heroText: 'MODE', primaryColor: '#000000', accentColor: '#c5a059', bgColor: '#f8f5f2', bankName: 'CIH BANK', rib: '230 120 4567890123 001 99', adminPassword: '123', myWhatsApp: '212600000000', logo: '', baseFontSize: 16 },
                garmentFields: { 
                    "Pantalon": ["ceinture", "bassin", "cuisse", "Molet", "longueur totale", "palma"],
                    "Veste": ["épaule", "poitrine", "taille", "hanche", "bassin", "longueur totale", "longueur manche", "tour de bras"],
                    "Chemise": ["épaule", "poitrine", "taille", "longueur totale", "longueur manche"],
                    "Jupe": ["ceinture", "bassin", "longueur totale"],
                    "Kimono": ["épaule", "poitrine", "longueur totale", "longueur manche"],
                    "Robe": ["épaule", "poitrine", "tour de taille", "hanche", "bassin", "longueur totale", "longueur manche"],
                    "Cap": ["épaule", "longueur totale"],
                    "Manteau": ["épaule", "poitrine", "taille", "bassin", "longueur totale", "longueur manche"],
                    "Jelaba": ["épaule", "poitrine", "tour de taille", "hanche", "bassin", "longueur poitrine", "longueur totale", "longueur manche", "tour de bras", "poignée"],
                    "Gilet": ["épaule", "poitrine", "taille", "longueur totale"]
                },
                fabrics: [], models: [], allOrders: [],
                order: { id: '', garmentType: '', model: '', fabric: '', price: 0, measurements: {}, customerName: '', phone: '', city: '', fullAddress: '', date: '', refNumber: '' },

                async init() {
                    // تأمين اختفاء الدائرة بعد 5 ثواني مهما حدث
                    setTimeout(() => { if(this.loading) this.loading = false; }, 5000);
                    try {
                        const snap = await database.ref('/').once('value');
                        const data = snap.val();
                        if (data) {
                            if (data.settings) this.settings = data.settings;
                            if (data.garmentFields) this.garmentFields = data.garmentFields;
                            if (data.fabrics) this.fabrics = Object.values(data.fabrics);
                            if (data.models) this.models = Object.values(data.models);
                            if (data.orders) this.allOrders = Object.values(data.orders).reverse();
                        }
                    } catch (e) { console.error("Firebase Error:", e); }
                    this.loading = false;
                },

                t(key) { return lexicon[this.settings.lang || 'ar'][key] || key; },

                async saveToCloud() {
                    this.loading = true;
                    await database.ref('settings').set(this.settings);
                    await database.ref('garmentFields').set(this.garmentFields);
                    this.loading = false;
                },

                uploadLogo(event) {
                    let f = event.target.files[0];
                    if(f){
                        let r = new FileReader();
                        r.onload = e => { this.settings.logo = e.target.result; this.saveToCloud(); };
                        r.readAsDataURL(f);
                    }
                },

                uploadModelImg(event) {
                    let r = new FileReader();
                    r.onload = x => this.newMod.img = x.target.result;
                    r.readAsDataURL(event.target.files[0]);
                },

                async addMod() {
                    if(this.newMod.name && this.newMod.img) {
                        const id = Date.now();
                        await database.ref('models/' + id).set({id, ...this.newMod});
                        this.newMod = {name:'', price:'', img:''};
                        this.init();
                    }
                },
                async deleteModel(id) {
                    if(confirm('حذف؟')) { await database.ref('models/' + id).remove(); this.init(); }
                },
                async addFab() {
                    if(this.newFab) {
                        const id = Date.now();
                        await database.ref('fabrics/' + id).set({id, name: this.newFab});
                        this.newFab = '';
                        this.init();
                    }
                },
                async deleteFabric(id) { await database.ref('fabrics/' + id).remove(); this.init(); },

                loginAdmin() {
                    let p = prompt(this.settings.lang==='ar'?"القن السري:":"Code:");
                    if(p === this.settings.adminPassword) this.view = 'admin';
                },

                updateFields() {
                    this.order.measurements = {};
                    if(this.garmentFields[this.order.garmentType]) {
                        this.garmentFields[this.order.garmentType].forEach(f => this.order.measurements[f] = '');
                    }
                },

                async submitOrder() {
                    if(!this.order.customerName || !this.order.garmentType) return alert(this.t('selectGarment'));
                    this.order.id = Math.floor(10000 + Math.random() * 90000);
                    this.order.date = new Date().toLocaleString();
                    await database.ref('orders/' + this.order.id).set(this.order);
                    this.view = 'invoice';
                    window.scrollTo(0,0);
                },

                confirmWithWhatsApp() {
                    if(!this.order.refNumber) return alert(this.t('enterRef'));
                    let msg = `*COMMANDE MOUNIR MODE*%0AID: #MO-${this.order.id}%0AType: ${this.order.garmentType}%0AREF: ${this.order.refNumber}`;
                    window.open(`https://wa.me/${this.settings.myWhatsApp}?text=${msg}`);
                },

                async deleteOrderCloud(id) {
                    if(confirm('حذف؟')) { await database.ref('orders/' + id).remove(); this.init(); }
                },

                addNewGarmentType() {
                    let n = prompt("Nom vêtement / اسم اللباس:");
                    if(n) { this.garmentFields[n] = ["épaule", "longueur totale"]; this.saveToCloud(); }
                },
                addField(type) {
                    let f = prompt("Measurement / القياس:");
                    if(f) { this.garmentFields[type].push(f); this.saveToCloud(); }
                },
                removeField(type, index) {
                    this.garmentFields[type].splice(index, 1);
                    this.saveToCloud();
                },
                deleteGarmentType(type) { if(confirm('حذف؟')) { delete this.garmentFields[type]; this.saveToCloud(); } }
            }
        }
    </script>
