<!DOCTYPE html>
<html lang="ar" :dir="settings.lang === 'ar' ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="settings.appTitle">MOUNIR ESPACE-MODE</title>
    <!-- التقنيات المستخدمة -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        [x-cloak] { display: none !important; }
        @media print { .no-print { display: none !important; } }
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; transition: all 0.3s ease; color: black; }
        .logo-img { width: 50px; height: 50px; object-fit: cover; border-radius: 50%; border: 2px solid; cursor: pointer; }
        .instruction-box { background-color: #fff5f5; border: 2px solid #feb2b2; border-radius: 1rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        select, input, textarea { background-color: white !important; color: black !important; }
        .loading-overlay { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body x-data="mounirApp()" x-init="init()">

    <!-- شاشة التحميل الذكية -->
    <div x-show="loading" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-black mb-4"></div>
        <p class="font-bold">MOUNIR ESPACE-MODE</p>
    </div>

    <!-- Header (تم إخفاء زر لوحة التحكم - الدخول عبر الشعار) -->
    <header :style="{ backgroundColor: settings.primaryColor }" class="text-white p-4 shadow-lg flex justify-between items-center no-print sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div @click="loginAdmin()" class="cursor-pointer">
                <template x-if="settings.logo"><img :src="settings.logo" :style="{ borderColor: settings.accentColor }" class="logo-img"></template>
                <template x-if="!settings.logo">
                    <div :style="{ backgroundColor: settings.accentColor }" class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-black text-xl shadow-md">
                        <span x-text="settings.appTitle ? settings.appTitle.charAt(0) : 'M'">M</span>
                    </div>
                </template>
            </div>
            <h1 :style="{ color: settings.accentColor }" class="font-bold tracking-widest uppercase italic text-sm md:text-lg" x-text="settings.appTitle"></h1>
        </div>
        <button @click="view = 'customer'" class="text-xs font-bold bg-white/10 px-3 py-1 rounded-full hover:bg-white/20 transition" x-text="t('newOrder')"></button>
    </header>

    <main class="container mx-auto mt-6 p-4 max-w-4xl">

        <!-- واجهة الزبون (نفس تصميم الصورة بالضبط) -->
        <template x-if="view === 'customer'">
            <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-200 animate-fadeIn">
                <!-- شريط العنوان (MODE) -->
                <div :style="{ backgroundColor: settings.primaryColor }" class="p-4 text-center border-b-4" :style="{ borderBottomColor: settings.accentColor }">
                    <h2 class="text-white text-2xl font-black italic uppercase tracking-[0.3em]" x-text="settings.heroText"></h2>
                </div>

                <div class="p-6 md:p-10 space-y-8">
                    <!-- القسم 1: الاختيارات -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="font-bold text-gray-700 flex items-center gap-2" x-text="t('customerType')"></label>
                            <select x-model="order.customerType" class="w-full border-2 border-gray-200 p-4 rounded-2xl outline-none focus:border-black transition font-bold">
                                <option value="" x-text="t('select')"></option>
                                <option :value="t('woman')" x-text="t('woman')"></option>
                                <option :value="t('man')" x-text="t('man')"></option>
                                <option :value="t('girl')" x-text="t('girl')"></option>
                                <option :value="t('boy')" x-text="t('boy')"></option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="font-bold text-gray-700 flex items-center gap-2" x-text="t('selectGarment')"></label>
                            <select x-model="order.garmentType" @change="updateFields()" class="w-full border-2 border-gray-200 p-4 rounded-2xl outline-none font-bold text-blue-800 transition">
                                <option value="" x-text="t('select')"></option>
                                <template x-for="type in Object.keys(garmentFields)" :key="type">
                                    <option :value="type" x-text="type"></option>
                                </template>
                            </select>
                        </div>
                    </div>

                    <!-- القسم 2: الألبوم (الموديلات) -->
                    <div class="space-y-4" x-show="models.length > 0">
                        <label :style="{ borderLeftColor: settings.accentColor, borderRightColor: settings.accentColor }" class="font-bold text-lg border-x-4 px-3 italic block" x-text="t('selectModel')"></label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <template x-for="m in models" :key="m.id">
                                <div @click="order.model = m.name; order.price = m.price" 
                                     :class="order.model === m.name ? 'ring-4' : 'border'"
                                     :style="{ ringColor: settings.accentColor, borderColor: order.model === m.name ? settings.accentColor : '#e5e7eb' }"
                                     class="cursor-pointer relative rounded-2xl overflow-hidden bg-white transition transform hover:scale-105 shadow-md">
                                    <img :src="m.img" class="w-full h-40 object-cover">
                                    <div class="p-2 text-center border-t bg-gray-50">
                                        <p class="font-bold text-[10px] uppercase text-gray-600" x-text="m.name"></p>
                                        <p :style="{ color: settings.accentColor }" class="font-black text-xs" x-text="m.price + ' ' + t('currency')"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- القسم 3: الأقمشة -->
                    <div class="space-y-4" x-show="fabrics.length > 0">
                        <label :style="{ borderLeftColor: settings.accentColor, borderRightColor: settings.accentColor }" class="font-bold text-lg border-x-4 px-3 italic block" x-text="t('selectFabric')"></label>
                        <div class="flex gap-3 overflow-x-auto pb-2">
                            <template x-for="f in fabrics" :key="f.id">
                                <button @click="order.fabric = f.name" 
                                     :style="order.fabric === f.name ? { backgroundColor: settings.accentColor, color: 'black' } : { backgroundColor: 'white', color: 'black' }"
                                     class="border-2 px-6 py-2 rounded-2xl whitespace-nowrap transition font-bold shadow-sm" x-text="f.name">
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- القسم 4: القياسات -->
                    <template x-if="order.garmentType">
                        <div :style="{ borderColor: settings.accentColor + '44' }" class="bg-gray-50 p-6 rounded-3xl border-2 border-dashed animate-fadeIn">
                            <h3 class="font-black text-lg mb-6 border-b pb-2 text-black uppercase" x-text="t('enterMeasurements')"></h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                                <template x-for="field in garmentFields[order.garmentType]" :key="field">
                                    <div class="space-y-1">
                                        <label class="text-[10px] font-bold text-gray-500 uppercase" x-text="t(field) || field"></label>
                                        <input type="number" x-model="order.measurements[field]" class="w-full border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-black font-mono font-bold shadow-inner">
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- القسم 5: معلومات الزبون -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-6 border-t">
                        <input type="text" :placeholder="t('fullName')" x-model="order.customerName" class="border-2 p-4 rounded-2xl outline-none focus:border-black font-bold">
                        <input type="tel" :placeholder="t('phone')" x-model="order.phone" class="border-2 p-4 rounded-2xl outline-none focus:border-black font-bold">
                        <input type="text" :placeholder="t('city')" x-model="order.city" class="border-2 p-4 rounded-2xl outline-none focus:border-black font-bold">
                        <textarea :placeholder="t('address')" x-model="order.fullAddress" class="border-2 p-4 rounded-2xl outline-none focus:border-black font-bold h-24"></textarea>
                    </div>

                    <button @click="submitOrder()" :style="{ backgroundColor: settings.primaryColor }" class="w-full text-white py-5 rounded-3xl text-xl font-black shadow-2xl hover:opacity-90 transition transform active:scale-95" x-text="t('confirmBtn')"></button>
                </div>
            </div>
        </template>

        <!-- واجهة الفاتورة (مع صندوق الأمان المطلب) -->
        <template x-if="view === 'invoice'">
            <div class="max-w-2xl mx-auto bg-white p-8 md:p-12 rounded-3xl shadow-2xl border-t-8 border-black animate-fadeIn text-black font-bold">
                <div class="flex justify-between items-start border-b pb-6 mb-8">
                    <div class="flex items-center gap-3">
                         <template x-if="settings.logo"><img :src="settings.logo" class="logo-img"></template>
                         <div>
                            <h2 :style="{ color: settings.accentColor }" class="text-3xl font-black italic underline" x-text="settings.appTitle"></h2>
                            <p class="text-[10px] text-gray-400 mt-1 uppercase font-bold" x-text="settings.heroText"></p>
                         </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-xl" x-text="t('orderNo') + ': #MO-' + order.id"></p>
                        <p class="text-xs text-gray-500 font-mono font-bold" x-text="order.date"></p>
                    </div>
                </div>

                <!-- صندوق الأمان (من الصورة) -->
                <div class="instruction-box shadow-md">
                    <h4 class="text-red-700 font-black flex items-center gap-2 mb-4 text-xl italic">
                        <span>⚠️</span> <span x-text="t('payTitle')"></span>
                    </h4>
                    <ul class="text-sm md:text-base text-red-900 font-bold space-y-4 pr-4 list-disc">
                        <li x-html="t('payPoint1').replace('{id}', '#MO-'+order.id)"></li>
                        <li x-text="t('payPoint2')"></li>
                        <li x-text="t('payPoint3')"></li>
                    </ul>
                </div>

                <div :style="{ borderColor: settings.accentColor }" class="border-2 p-6 rounded-3xl bg-gray-50 space-y-4 mb-8 shadow-inner">
                    <p class="text-center font-bold border-b pb-2 uppercase gold-color italic tracking-widest text-black" x-text="t('bankInfo')"></p>
                    <div class="space-y-3 text-sm md:text-base font-bold text-black text-center md:text-right">
                        <p x-text="t('bankName') + ': ' + settings.bankName"></p>
                        <p class="underline font-black" x-text="t('rib') + ':'"></p>
                        <p :style="{ borderColor: settings.accentColor }" class="font-mono bg-white p-4 text-center rounded-xl border-2 text-lg md:text-2xl font-black tracking-widest select-all shadow-md text-black" x-text="settings.rib"></p>
                        <div class="flex justify-between items-center border-t pt-4">
                            <span x-text="t('total') + ':'"></span>
                            <span :style="{ color: settings.accentColor }" class="font-black text-3xl" x-text="order.price + ' ' + t('currency')"></span>
                        </div>
                    </div>
                </div>

                <div class="bg-black text-white p-6 rounded-3xl mb-8 shadow-xl text-center border-b-4" :style="{ borderBottomColor: settings.accentColor }">
                    <label class="block text-sm font-bold gold-color underline italic mb-4" x-text="t('enterRef')"></label>
                    <input type="text" x-model="order.refNumber" :placeholder="t('refPlaceholder')" class="w-full p-4 rounded-2xl text-black font-mono font-black outline-none border-2 border-gold text-center text-xl shadow-inner">
                </div>

                <div class="flex flex-col gap-4 no-print">
                    <button @click="confirmWithWhatsApp()" class="w-full bg-green-600 text-white py-5 rounded-3xl font-black text-xl shadow-xl flex justify-center items-center gap-3 hover:bg-green-700 transition active:scale-95">
                         إرسال وصل التحويل عبر WhatsApp
                    </button>
                    <div class="flex gap-3">
                        <button onclick="window.print()" class="flex-1 bg-black text-white py-4 rounded-2xl font-bold shadow-lg">طباعة</button>
                        <button @click="view = 'customer'" class="flex-1 bg-gray-200 py-4 rounded-2xl font-bold text-gray-600 shadow-lg">رجوع</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- لوحة التحكم (الدخول عبر الشعار) -->
        <template x-if="view === 'admin'">
            <div class="space-y-6 no-print animate-fadeIn text-black font-bold">
                <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow border-2 border-gold">
                    <h2 class="text-xl md:text-2xl font-black italic gold-color underline uppercase">لوحة تحكم المسؤول</h2>
                    <div class="flex gap-2 flex-wrap text-[9px] md:text-[10px]">
                        <button @click="adminTab = 'orders'" :class="adminTab === 'orders' ? 'bg-black text-white' : 'bg-gray-100'" class="px-4 py-2 rounded-full font-bold transition">الطلبات</button>
                        <button @click="adminTab = 'garments'" :class="adminTab === 'garments' ? 'bg-black text-white' : 'bg-gray-100'" class="px-4 py-2 rounded-full font-bold transition">القياسات</button>
                        <button @click="adminTab = 'catalog'" :class="adminTab === 'catalog' ? 'bg-black text-white' : 'bg-gray-100'" class="px-4 py-2 rounded-full font-bold transition">الألبوم</button>
                        <button @click="adminTab = 'settings'" :class="adminTab === 'settings' ? 'bg-black text-white' : 'bg-gray-100'" class="px-4 py-2 rounded-full font-bold transition">الإعدادات</button>
                    </div>
                </div>

                <!-- تبويب الإعدادات -->
                <div x-show="adminTab === 'settings'" class="bg-white p-8 rounded-3xl shadow-xl border-t-8 border-gold space-y-8 animate-fadeIn">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                        <div class="space-y-4">
                            <h3 class="font-black border-b pb-2 text-gold-700 italic uppercase">الأمان والبنك</h3>
                            <div class="bg-blue-50 p-4 rounded-2xl border-2 border-blue-200 shadow-inner mb-4">
                                <label class="text-xs font-bold block mb-2 underline">لغة الواجهة:</label>
                                <select x-model="settings.lang" @change="saveToCloud()" class="w-full border-2 p-2 rounded-xl font-bold text-black outline-none">
                                    <option value="ar">العربية</option><option value="fr">Français</option>
                                </select>
                            </div>
                            <div><label class="text-xs font-bold block mb-1">اسم البنك:</label><input type="text" x-model="settings.bankName" class="w-full border-2 p-3 rounded-xl font-bold"></div>
                            <div><label class="text-xs font-bold block mb-1">RIB:</label><input type="text" x-model="settings.rib" class="w-full border-2 p-3 rounded-xl font-mono"></div>
                            <div><label class="text-xs font-bold block mb-1 text-red-600 underline">كلمة السر (السرية):</label><input type="password" x-model="settings.adminPassword" class="w-full border-2 p-3 rounded-xl font-bold"></div>
                        </div>

                        <div class="space-y-4">
                            <h3 class="font-black border-b pb-2 text-blue-700 italic uppercase">الهوية والألوان</h3>
                            <div class="bg-yellow-50 p-4 rounded-2xl border-2 border-gold shadow-inner mb-4">
                                <label class="text-xs font-bold block mb-2 text-red-600 underline italic uppercase tracking-widest">عنوان البطاقة (بدلاً من MODE):</label>
                                <input type="text" x-model="settings.heroText" class="w-full border-2 border-gold p-3 rounded-xl text-black font-black text-center">
                            </div>
                            <div class="bg-gray-50 p-4 rounded-2xl border-2 border-dashed border-gray-300">
                                <label class="text-xs font-bold block mb-2 underline text-center">تغيير الشعار (Logo):</label>
                                <div class="flex items-center gap-4 justify-center">
                                    <template x-if="settings.logo"><img :src="settings.logo" class="logo-img"></template>
                                    <input type="file" @change="uploadLogo" class="text-[10px] w-full">
                                </div>
                            </div>
                            <div><label class="text-xs font-bold block mb-1 text-green-700 font-black">رقم واتسابك (بـ 212):</label><input type="text" x-model="settings.myWhatsApp" class="w-full border-2 border-green-300 p-3 rounded-xl font-bold"></div>
                            <div><label class="text-xs font-bold block mb-1">اسم المتجر العلوي:</label><input type="text" x-model="settings.appTitle" class="w-full border-2 p-3 rounded-xl font-bold"></div>
                            <div class="flex gap-4">
                                <div class="flex-1 font-bold"><label class="text-[10px]">اللون الرئيسي:</label><input type="color" x-model="settings.primaryColor" class="w-full h-10 border shadow-sm cursor-pointer rounded-xl"></div>
                                <div class="flex-1 font-bold"><label class="text-[10px]">اللون الذهبي:</label><input type="color" x-model="settings.accentColor" class="w-full h-10 border shadow-sm cursor-pointer rounded-xl"></div>
                            </div>
                        </div>
                    </div>
                    <button @click="saveToCloud(); alert('تم حفظ الإعدادات بنجاح!')" class="w-full bg-black text-white py-5 rounded-3xl font-black shadow-2xl hover:bg-gold transition uppercase tracking-widest">تحديث التطبيق للجميع</button>
                </div>

                <!-- باقي التبويبات (الأصناف والألبوم والطلبات) -->
                <div x-show="adminTab === 'garments'" class="bg-white p-6 rounded-3xl shadow-xl border-t-8 border-black space-y-6 animate-fadeIn">
                    <h3 class="font-black text-xl border-b pb-2 italic gold-color underline uppercase">⚙️ إدارة أصناف الملابس والقياسات</h3>
                    <div class="space-y-4">
                        <template x-for="(fields, type) in garmentFields" :key="type">
                            <div class="border-2 p-5 rounded-2xl bg-gray-50 flex justify-between items-start shadow-sm">
                                <div class="flex-1 font-bold">
                                    <h4 class="font-black text-blue-900 mb-3 border-r-4 border-blue-900 pr-2" x-text="type"></h4>
                                    <div class="flex flex-wrap gap-2">
                                        <template x-for="(field, index) in fields" :key="index">
                                            <span class="bg-white border-2 border-gray-200 px-3 py-1 rounded-xl text-[10px] font-black flex items-center gap-2 shadow-sm">
                                                <span x-text="t(field) || field"></span>
                                                <button @click="removeField(type, index)" class="text-red-500 font-black hover:scale-125 transition">×</button>
                                            </span>
                                        </template>
                                        <button @click="addField(type)" class="text-green-600 font-black text-xs underline decoration-double">+ إضافة قياس</button>
                                    </div>
                                </div>
                                <button @click="deleteGarmentType(type)" class="text-red-600 text-[10px] font-black bg-white px-3 py-1 rounded-xl border-2 border-red-100 hover:bg-red-600 hover:text-white transition shadow-sm">حذف</button>
                            </div>
                        </template>
                        <button @click="addNewGarmentType()" class="w-full border-4 border-dashed border-gray-300 py-6 rounded-3xl font-black text-gray-400 hover:border-black hover:text-black transition uppercase tracking-widest">+ إضافة صنف لباس جديد</button>
                    </div>
                </div>

                <div x-show="adminTab === 'catalog'" class="grid grid-cols-1 md:grid-cols-2 gap-8 animate-fadeIn">
                    <div class="bg-white p-6 rounded-3xl shadow-xl border-t-8 border-gold">
                        <h3 class="font-black mb-6 border-b pb-2 italic uppercase">إدارة الألبوم (الموديلات)</h3>
                        <div class="space-y-4 mb-6 bg-gray-50 p-4 rounded-2xl border-2">
                            <input type="text" x-model="newMod.name" placeholder="اسم الموديل" class="w-full border-2 p-3 rounded-xl font-bold">
                            <input type="number" x-model="newMod.price" placeholder="الثمن" class="w-full border-2 p-3 rounded-xl font-bold">
                            <input type="file" @change="uploadModelImg" class="text-[10px] w-full font-bold">
                            <button @click="addMod()" class="w-full bg-gold text-black py-3 rounded-2xl font-black shadow-lg">+ إضافة للألبوم</button>
                        </div>
                        <div class="grid grid-cols-2 gap-3 max-h-80 overflow-y-auto pr-2 font-bold">
                            <template x-for="(m, i) in models" :key="m.id">
                                <div class="border-2 p-2 rounded-2xl relative bg-white shadow-sm"><img :src="m.img" class="w-full h-20 object-cover rounded-xl shadow-inner"><p class="text-[10px] font-black mt-2 text-center" x-text="m.name"></p><button @click="deleteModel(m.id)" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-6 h-6 font-black shadow-lg">×</button></div>
                            </template>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-xl border-t-8 border-black font-bold">
                        <h3 class="font-black mb-6 border-b pb-2 italic uppercase">إدارة الأقمشة</h3>
                        <div class="flex gap-2 mb-6"><input type="text" x-model="newFab" placeholder="قماش جديد" class="flex-1 border-2 p-3 rounded-xl font-bold"><button @click="addFab()" class="bg-black text-white px-5 rounded-xl font-black shadow-lg">إضافة</button></div>
                        <div class="flex flex-wrap gap-2 max-h-80 overflow-y-auto">
                            <template x-for="(f, i) in fabrics" :key="f.id">
                                <div class="bg-gray-100 px-4 py-2 rounded-full border-2 text-[10px] font-black flex items-center gap-2 shadow-sm text-black"><span x-text="f.name"></span><button @click="deleteFabric(f.id)" class="text-red-500 font-black hover:scale-125 transition">×</button></div>
                            </template>
                        </div>
                    </div>
                </div>

                <div x-show="adminTab === 'orders'" class="bg-white rounded-3xl shadow-xl overflow-hidden border-2 text-black animate-fadeIn font-bold">
                    <table class="w-full text-right text-xs md:text-sm">
                        <thead class="bg-black text-white font-black uppercase tracking-widest italic">
                            <tr><th class="p-5">الزبون</th><th class="p-5">اللباس</th><th class="p-5">المبلغ</th><th class="p-5 text-gold-500 italic">الرقم المرجعي</th><th class="p-5 text-center">تحكم</th></tr>
                        </thead>
                        <tbody>
                            <template x-for="o in allOrders" :key="o.id">
                                <tr class="border-b hover:bg-yellow-50 transition border-gray-100 font-bold">
                                    <td class="p-5 font-black text-black" x-text="o.customerName"></td>
                                    <td class="p-5 text-gray-600 font-black" x-text="o.garmentType"></td>
                                    <td class="p-5 font-black text-gold-600" x-text="o.price + ' MAD'"></td>
                                    <td class="p-5 font-mono font-black text-blue-700 bg-blue-50 text-center shadow-inner" x-text="o.refNumber || '---'"></td>
                                    <td class="p-5 flex gap-2 justify-center"><button @click="order = o; view = 'invoice'" class="text-blue-600 font-black underline text-xs">عرض</button><button @click="deleteOrderCloud(o.id)" class="text-red-600 font-black text-xs">حذف</button></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </template>
    </main>

    <script>
        // تكوين Firebase الخاص بك (مربوط وجاهز)
        const firebaseConfig = {
          apiKey: "AIzaSyACA1TBYTfvBBtD2V6qLLKQKAdO_a8wRZU",
          authDomain: "fashionapp-1c25e.firebaseapp.com",
          databaseURL: "https://fashionapp-1c25e-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "fashionapp-1c25e",
          storageBucket: "fashionapp-1c25e.firebasestorage.app",
          messagingSenderId: "716111219310",
          appId: "1:716111219310:web:67d344b1e8838d2074347f"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function mounirApp() {
            const lexicon = {
                ar: {
                    newOrder: "طلب جديد", adminPanel: "لوحة التحكم 🔒", customerType: "نوع الزبون", woman: "امرأة", man: "رجل", girl: "بنت", boy: "ولد",
                    garmentType: "نوع اللباس", select: "اختر من القائمة...", selectGarment: "ماذا تريد أن تفصل؟", selectModel: "اختر الموديل المطلوب", 
                    selectFabric: "اختر نوع القماش", enterMeasurements: "أدخل القياسات المطلوبة (cm)", fullName: "الاسم الكامل للزبون",
                    phone: "رقم الهاتف (واتساب)", city: "المدينة", address: "العنوان الكامل للشحن", confirmBtn: "تأكيد الطلب واستخراج الفاتورة",
                    orderNo: "رقم الطلب", bankInfo: "بيانات التحويل البنكي", bankName: "البنك", rib: "رقم الحساب (RIB)", total: "المبلغ المطلوب",
                    currency: "درهم", enterRef: "أدخل رقم العملية المكتوب في الوصل:", refPlaceholder: "أدخل الرقم هنا...",
                    whatsappBtn: "إرسال وصل التحويل عبر WhatsApp", print: "طباعة", back: "رجوع", 
                    saveBtn: "حفظ التغييرات للجميع", refNumberShort: "الرقم المرجعي", view: "عرض", delete: "حذف",
                    payTitle: "تعليمات الأداء الهامة لتجنب إلغاء الطلب:",
                    payPoint1: "اكتب رقم الطلب ({id}) في خانة \"سبب التحويل\" (Motif).",
                    payPoint2: "لا تبدأ عملية الخياطة إلا بعد تأكدنا من دخول المبلغ لحسابنا.",
                    payPoint3: "إرسال صورة الوصل المزور يعرضك للمساءلة القانونية.",
                    épaule: "الكتف", poitrine: "الصدر", "tour de taille": "دورة الخصر", hanche: "الورك", bassin: "الحوض", "longueur poitrine": "طول الصدر", "longueur taille": "طول الخصر", "longueur hanche": "طول الورك", "longueur bassin": "طول الحوض", "longueur genou": "طول الركبة", "longueur totale": "الطول الكلي", "longueur manche": "طول الكم", "tour de bras": "دورة الذراع", poignée: "المعصم", ceinture: "الحزام", cuisse: "الفخذ", Molet: "بطة الساق", palma: "عرض الساق", taille: "الخصر"
                },
                fr: {
                    newOrder: "Nouveau", adminPanel: "Admin 🔒", customerType: "Genre", woman: "Femme", man: "Homme", girl: "Fille", boy: "Garçon",
                    garmentType: "Vêtement", select: "Choisir...", selectGarment: "Vêtement ?", selectModel: "Modèle",
                    selectFabric: "Tissu", enterMeasurements: "Mesures (cm)", fullName: "Nom",
                    phone: "WhatsApp", city: "Ville", address: "Livraison", confirmBtn: "Confirmer",
                    orderNo: "N° Commande", bankInfo: "Banque", bankName: "Banque", rib: "RIB", total: "Total",
                    currency: "MAD", enterRef: "N° transaction :", refPlaceholder: "Référence...",
                    whatsappBtn: "WhatsApp", print: "Imprimer", back: "Retour",
                    épaule: "Épaule", poitrine: "Poitrine", "tour de taille": "Tour de taille", hanche: "Hanche", bassin: "Bassin", "longueur poitrine": "L. Poitrine", "longueur totale": "L. Totale", "longueur manche": "L. Manche", "tour de bras": "Tour de bras", poignée: "Poignée", ceinture: "Ceinture", cuisse: "Cuisse", Molet: "Mollet", palma: "Palma", taille: "Taille"
                }
            };

            return {
                view: 'customer', adminTab: 'orders', loading: true, newMod: {name:'', price:'', img:''}, newFab: '',
                settings: { lang: 'ar', appTitle: 'MOUNIR ESPACE-MODE', heroText: 'MODE', primaryColor: '#000000', accentColor: '#c5a059', bgColor: '#f3f4f6', bankName: 'CIH BANK', rib: '011 230 0000123456789012 99', adminPassword: '123', myWhatsApp: '212600000000', logo: '', baseFontSize: 16 },
                garmentFields: { 
                    "Pantalon": ["ceinture", "bassin", "cuisse", "Molet", "longueur totale", "palma"],
                    "Veste": ["épaule", "poitrine", "taille", "hanche", "bassin", "longueur totale", "longueur manche", "tour de bras"],
                    "Chemise": ["épaule", "poitrine", "taille", "longueur totale", "longueur manche"],
                    "Jupe": ["ceinture", "bassin", "longueur totale"],
                    "Kimono": ["épaule", "poitrine", "longueur totale", "longueur manche"],
                    "Robe": ["épaule", "poitrine", "tour de taille", "hanche", "bassin", "longueur totale", "longueur manche"],
                    "Cap": ["épaule", "longueur totale"],
                    "Manteau": ["épaule", "poitrine", "taille", "bassin", "longueur totale", "longueur manche"],
                    "Jelaba": ["épaule", "poitrine", "tour de taille", "hanche", "bassin", "longueur poitrine", "longueur totale", "longueur manche", "tour de bras", "poignée"],
                    "Gilet": ["épaule", "poitrine", "taille", "longueur totale"]
                },
                fabrics: [], models: [], allOrders: [],
                order: { id: '', garmentType: '', model: '', modelImg: '', fabric: '', price: 0, measurements: {}, customerName: '', phone: '', city: '', fullAddress: '', date: '', refNumber: '' },

                async init() {
                    setTimeout(() => { if(this.loading) this.loading = false; }, 6000);
                    try {
                        const snap = await database.ref('/').once('value');
                        const data = snap.val();
                        if (data) {
                            if (data.settings) this.settings = data.settings;
                            if (data.garmentFields) this.garmentFields = data.garmentFields;
                            if (data.fabrics) this.fabrics = Object.values(data.fabrics);
                            if (data.models) this.models = Object.values(data.models);
                            if (data.orders) this.allOrders = Object.values(data.orders).reverse();
                        }
                    } catch (e) { console.error(e); }
                    this.loading = false;
                },

                t(key) { return lexicon[this.settings.lang || 'ar'][key] || key; },

                async saveToCloud() {
                    this.loading = true;
                    await database.ref('settings').set(this.settings);
                    await database.ref('garmentFields').set(this.garmentFields);
                    this.loading = false;
                },

                uploadLogo(event) {
                    let f = event.target.files[0];
                    if(f){
                        let r = new FileReader();
                        r.onload = e => { this.settings.logo = e.target.result; this.saveToCloud(); };
                        r.readAsDataURL(f);
                    }
                },

                uploadModelImg(event) {
                    let r = new FileReader();
                    r.onload = x => this.newMod.img = x.target.result;
                    r.readAsDataURL(event.target.files[0]);
                },

                async addMod() {
                    if(this.newMod.name && this.newMod.img) {
                        const id = Date.now();
                        await database.ref('models/' + id).set({id, ...this.newMod});
                        this.newMod = {name:'', price:'', img:''};
                        this.init();
                    }
                },
                async deleteModel(id) {
                    if(confirm('حذف؟')) { await database.ref('models/' + id).remove(); this.init(); }
                },
                async addFab() {
                    if(this.newFab) {
                        const id = Date.now();
                        await database.ref('fabrics/' + id).set({id, name: this.newFab});
                        this.newFab = '';
                        this.init();
                    }
                },
                async deleteFabric(id) { await database.ref('fabrics/' + id).remove(); this.init(); },

                loginAdmin() {
                    let p = prompt("القن السري للمسؤول:");
                    if(p === this.settings.adminPassword) this.view = 'admin';
                    else if(p !== null) alert("قن خاطئ!");
                },

                updateFields() {
                    this.order.measurements = {};
                    if(this.garmentFields[this.order.garmentType]) {
                        this.garmentFields[this.order.garmentType].forEach(f => this.order.measurements[f] = '');
                    }
                },

                async submitOrder() {
                    if(!this.order.customerName || !this.order.garmentType) return alert(this.t('selectGarment'));
                    this.order.id = Math.floor(10000 + Math.random() * 90000);
                    this.order.date = new Date().toLocaleString();
                    await database.ref('orders/' + this.order.id).set(this.order);
                    this.view = 'invoice';
                    window.scrollTo(0,0);
                },

                confirmWithWhatsApp() {
                    if(!this.order.refNumber) return alert(this.t('enterRef'));
                    let msg = `*COMMANDE MOUNIR MODE*%0AID: #MO-${this.order.id}%0AType: ${this.order.garmentType}%0AMontant: ${this.order.price} MAD%0AREF: ${this.order.refNumber}`;
                    window.open(`https://wa.me/${this.settings.myWhatsApp}?text=${msg}`);
                },

                async deleteOrderCloud(id) {
                    if(confirm('حذف؟')) { await database.ref('orders/' + id).remove(); this.init(); }
                },

                addNewGarmentType() {
                    let n = prompt("Nom vêtement / اسم اللباس:");
                    if(n) { this.garmentFields[n] = ["épaule", "longueur totale"]; this.saveToCloud(); }
                },
                addField(type) {
                    let f = prompt("Measurement / القياس:");
                    if(f) { this.garmentFields[type].push(f); this.saveToCloud(); }
                },
                removeField(type, index) {
                    this.garmentFields[type].splice(index, 1);
                    this.saveToCloud();
                },
                deleteGarmentType(type) { if(confirm('حذف؟')) { delete this.garmentFields[type]; this.saveToCloud(); } }
            }
        }
    </script>
</body>
